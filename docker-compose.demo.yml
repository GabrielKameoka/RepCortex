services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repcortex_demo
      POSTGRES_USER: repcortex_demo
      POSTGRES_PASSWORD: local_demo_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repcortex_demo -d repcortex_demo"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - demo-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-5154}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Database=repcortex_demo;Username=repcortex_demo;Password=local_demo_password
      Redis__ConnectionString: redis:6379
      Jwt__Secret: local-demo-signing-key-at-least-32-bytes-long
      Jwt__Issuer: RepCortexLocalDemo
      Jwt__Audience: RepCortexLocalDemo
      Database__ApplyMigrations: "true"
      Demo__SeedData: "true"
      Demo__TenantId: demo-loja
      Demo__AdminEmail: demo@repcortex.local
      Demo__AdminPassword: DemoPassword123!
      Cors__AllowedOrigins__0: http://localhost:${DEMO_FRONTEND_PORT:-4200}
      Cors__AllowedOrigins__1: http://127.0.0.1:${DEMO_FRONTEND_PORT:-4200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.demo
    ports:
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-4200}:4200"
    depends_on:
      - api

volumes:
  demo-postgres:
